<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>微光 · Moment</title>
  <meta name="description" content="一个安静的个人动态广场，所有内容只保存在本地浏览器。" />
  <meta name="theme-color" content="#f7f8fc" id="themeColor" />
  <script>
    // 在样式应用前定档主题，避免刷新时闪白
    (function () {
      var mode = "system";
      try {
        var saved = window.localStorage.getItem("moment.theme.v1");
        if (saved === "light" || saved === "dark" || saved === "system") {
          mode = saved;
        }
      } catch (err) {
        mode = "system";
      }
      var isDark = mode === "dark";
      if (mode === "system") {
        isDark = !!(
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
        );
      }
      var root = document.documentElement;
      root.setAttribute("data-theme-mode", mode);
      root.setAttribute("data-theme", isDark ? "dark" : "light");
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
